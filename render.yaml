services:
  - type: web
    name: invoice-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/invoice-desk
      - key: PYTHON_VERSION
        value: 3.12.7
